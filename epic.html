<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPPs — Epic</title>
<link rel="preconnect" href="https://rsms.me">
<link href="https://rsms.me/inter/inter.css" rel="stylesheet">
<style>
  :root {
    --bg-base: #111315;
    --bg-surface: #1C1F24;
    --accent: #FFD600;
    --accent-secondary: #FFE857;
    --ink-primary: #F5F2EA;
    --ink-secondary: #8D9199;
    --ink-muted: #5C6066;
    --ink-inverse: #111315;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    font-family: 'Inter var', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg-base);
    color: var(--ink-primary);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }

  .logo { height: 48px; margin-bottom: 16px; }

  .tagline {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 48px;
  }

  .videos {
    display: flex;
    flex-direction: column;
    gap: 32px;
    width: 100%;
    max-width: 800px;
  }

  .video-card {
    background: var(--bg-surface);
    border-radius: 16px;
    overflow: hidden;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    background: #000;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .video-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--ink-muted);
  }

  .video-placeholder svg {
    width: 48px;
    height: 48px;
    stroke: var(--ink-muted);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .video-placeholder span {
    font-size: 14px;
    font-weight: 600;
  }

  .video-label {
    padding: 16px 20px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-secondary);
  }

  footer {
    margin-top: 64px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13px;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>

<img src="public/Repps-Yellow-Logo.png" alt="REPPs" class="logo">
<p class="tagline">Micro-effort. Macro momentum.</p>

<div class="videos">
  <div class="video-card">
    <div class="video-wrapper">
      <iframe src="https://www.youtube-nocookie.com/embed/SAOSrsJD0u4?rel=0&modestbranding=1&playsinline=1" title="REPPs Intro" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="video-label">REPPs — Intro Video (1:17)</div>
  </div>

  <a href="/pitch.html" target="_blank" rel="noopener noreferrer" style="display:flex; align-items:center; justify-content:center; gap:10px; padding:16px 32px; background:var(--bg-surface); border-radius:12px; text-decoration:none; color:var(--accent); font-size:15px; font-weight:700; transition:transform 0.2s ease, box-shadow 0.2s ease;" onmouseover="this.style.transform='scale(1.02)';this.style.boxShadow='0 0 24px rgba(255,214,0,0.15)'" onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    View Pitch Deck
  </a>

  <div class="video-card">
    <div class="video-wrapper">
      <iframe src="https://www.youtube-nocookie.com/embed/thpx1xFjmco?rel=0&modestbranding=1&playsinline=1" title="REPPs Pitch" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="video-label">REPPs — Pitch Video (3:08)</div>
  </div>
</div>

<div style="margin-top:48px; width:100%; max-width:800px;">
  <a href="/" style="display:block; width:100%; padding:16px; background:var(--accent); color:var(--ink-inverse); font-size:17px; font-weight:700; text-align:center; text-decoration:none; border-radius:999px; transition:transform 0.2s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.2s ease;" onmouseover="this.style.transform='scale(1.03)';this.style.boxShadow='0 0 40px rgba(255,214,0,0.25)'" onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'">Join the Movement</a>
  <p style="text-align:center; margin-top:8px; font-size:13px; color:var(--ink-muted);">No sign-up required</p>
</div>

<footer>
  <p><a href="https://repps.pro">repps.pro</a></p>
</footer>

</body>
</html>
