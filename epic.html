<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPPs — Epic</title>
<link rel="preconnect" href="https://rsms.me">
<link href="https://rsms.me/inter/inter.css" rel="stylesheet">
<style>
  :root {
    --bg-base: #111315;
    --bg-surface: #1C1F24;
    --accent: #FFD600;
    --accent-secondary: #FFE857;
    --ink-primary: #F5F2EA;
    --ink-secondary: #8D9199;
    --ink-muted: #5C6066;
    --ink-inverse: #111315;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    font-family: 'Inter var', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg-base);
    color: var(--ink-primary);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }

  .logo { height: 48px; margin-bottom: 16px; }

  .tagline {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 48px;
  }

  .videos {
    display: flex;
    flex-direction: column;
    gap: 32px;
    width: 100%;
    max-width: 800px;
  }

  .video-card {
    background: var(--bg-surface);
    border-radius: 16px;
    overflow: hidden;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    background: #000;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .video-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--ink-muted);
  }

  .video-placeholder svg {
    width: 48px;
    height: 48px;
    stroke: var(--ink-muted);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .video-placeholder span {
    font-size: 14px;
    font-weight: 600;
  }

  .video-label {
    padding: 16px 20px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-secondary);
  }

  footer {
    margin-top: 64px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13px;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>

<img src="public/Repps-Yellow-Logo.png" alt="REPPs" class="logo">
<p class="tagline">Micro-effort. Macro momentum.</p>

<div class="videos">
  <div class="video-card">
    <div class="video-wrapper">
      <!-- Replace VIDEO_ID_1 with YouTube video ID -->
      <div class="video-placeholder" id="placeholder-1">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Video 1</span>
      </div>
    </div>
    <div class="video-label">Video 1</div>
  </div>

  <div class="video-card">
    <div class="video-wrapper">
      <!-- Replace VIDEO_ID_2 with YouTube video ID -->
      <div class="video-placeholder" id="placeholder-2">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Video 2</span>
      </div>
    </div>
    <div class="video-label">Video 2</div>
  </div>
</div>

<footer>
  <p><a href="https://repps.pro">repps.pro</a></p>
</footer>

</body>
</html>
